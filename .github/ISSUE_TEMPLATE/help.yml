name: 需要幫助嗎？
description: 如果你有些疑惑的話。
title: "[幫助]: "
labels: ["幫助"]

body:
  - type: textarea
    id: description
    attributes:
      label: 遇到了什麼問題？
      placeholder: 在這裡輸入問題的詳細描述，只接受簡體中文與繁體中文。
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 熒幕擷取與影片（可選）：
      placeholder: 可以直接將圖片或影片拖曳、複製貼上到此處。
    validations:
      required: false
